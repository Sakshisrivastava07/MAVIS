<!doctype html>
<!-- Local synthetic phone. LiveKit client is loaded from its published browser bundle. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAVIS Virtual Phone</title>
<style>
body{font:16px system-ui;background:#eef3f8;color:#17253a;display:grid;place-items:center;min-height:100vh;margin:0}.phone{background:white;width:min(360px,90vw);padding:26px;border-radius:22px;box-shadow:0 12px 40px #17314b22;text-align:center}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #b9c8d8}input{width:85%;margin:10px 0}button{cursor:pointer;background:#146c52;color:white;border:0;margin:5px}.hang{background:#a52e3b}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px}.keys button{background:#e8eef5;color:#17253a}.ring{display:none;margin:12px;color:#146c52}.dot{display:inline-block;width:8px;height:8px;background:#29a36f;border-radius:50%;animation:pulse .8s infinite}@keyframes pulse{50%{opacity:.2}}
</style><script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.6/dist/livekit-client.umd.min.js"></script></head>
<body><main class="phone"><h1>MAVIS</h1><p>Virtual phone · synthetic demo only</p><label for="caller">Fake caller ID</label><input id="caller" value="555-010-2048" maxlength="32"><div class="keys" id="keys"></div><button id="call">Call</button><button id="hang" class="hang" disabled>Hang up</button><div class="ring" id="ring"><span class="dot"></span> Ringing...</div><p id="status" role="status">Idle</p><audio id="audio" autoplay></audio></main>
<script>
const API='http://127.0.0.1:8001'; let room=null; const status=document.querySelector('#status'), ring=document.querySelector('#ring'), call=document.querySelector('#call'), hang=document.querySelector('#hang'), audio=document.querySelector('#audio');
for(const key of ['1','2','3','4','5','6','7','8','9','*','0','#']){const b=document.createElement('button');b.textContent=key;b.onclick=()=>document.querySelector('#caller').value+=key;document.querySelector('#keys').append(b)}
call.onclick=async()=>{call.disabled=true;status.textContent='Calling...';ring.style.display='block';try{const res=await fetch(API+'/call/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({caller_id:document.querySelector('#caller').value})});if(!res.ok)throw new Error('Token API rejected the caller ID.');const data=await res.json();room=new LivekitClient.Room();room.on(LivekitClient.RoomEvent.TrackSubscribed,(track)=>{if(track.kind==='audio'){audio.srcObject=new MediaStream([track.mediaStreamTrack]);audio.play().catch(()=>{});status.textContent='Connected · agent audio received'}});room.on(LivekitClient.RoomEvent.Connected,()=>{ring.style.display='none';status.textContent='Connected · waiting for MAVIS'});room.on(LivekitClient.RoomEvent.Disconnected,()=>{ring.style.display='none';status.textContent='Call ended';call.disabled=false;hang.disabled=true});await room.connect(data.url,data.token);await room.localParticipant.setMicrophoneEnabled(true);hang.disabled=false}catch(e){ring.style.display='none';status.textContent=(e.name==='NotAllowedError'?'Microphone permission denied: ':'Call failed: ')+e.message;call.disabled=false;room?.disconnect();room=null}};
hang.onclick=()=>room?.disconnect();
</script></body></html>
